name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: pytest -q
      - name: Tier comparison reproduces the committed numbers
        run: |
          kvtier report --out /tmp/results --only tier_comparison
          python - <<'PY'
          import json
          fresh = json.load(open("/tmp/results/tier_comparison.json"))
          committed = json.load(open("results/tier_comparison.json"))
          assert fresh == committed, "simulation is no longer deterministic or results are stale"
          print("tier comparison reproduced exactly")
          PY
